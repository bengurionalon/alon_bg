<main id="main">
  <div class="band" style="border-top:0">
    <div class="wrap">
      <h1 class="page-title">Заметки читателей</h1>
      <p class="lede">Всё, что читатели оставили на полях. Убранное со страниц
         остаётся здесь — его можно вернуть.</p>
      <form class="nt-form" id="keyForm" style="max-width:28rem">
        <input class="nt-name" id="keyInput" type="password" style="flex:1 1 12rem"
               placeholder="Ключ" aria-label="Ключ автора" autocomplete="off">
        <button class="nt-send" type="submit">Войти</button>
        <span class="nt-say" id="keySay" role="status"></span>
      </form>
      <div id="modList" style="margin-top:2rem"></div>
    </div>
  </div>
</main>
<script>
(function(){
  var API = "https://alon-api.bengurionalon.workers.dev";
  var WHERE = {"1": {"url": "../glava-1/", "book": "В сознание…", "n": 1}, "2": {"url": "../glava-2/", "book": "В сознание…", "n": 2}, "3": {"url": "../glava-3/", "book": "В сознание…", "n": 3}, "4": {"url": "../glava-4/", "book": "В сознание…", "n": 4}, "5": {"url": "../glava-5/", "book": "В сознание…", "n": 5}, "6": {"url": "../glava-6/", "book": "В сознание…", "n": 6}, "7": {"url": "../glava-7/", "book": "В сознание…", "n": 7}, "8": {"url": "../glava-8/", "book": "В сознание…", "n": 8}, "9": {"url": "../glava-9/", "book": "В сознание…", "n": 9}, "10": {"url": "../glava-10/", "book": "В сознание…", "n": 10}, "11": {"url": "../glava-11/", "book": "В сознание…", "n": 11}, "12": {"url": "../glava-12/", "book": "В сознание…", "n": 12}, "13": {"url": "../glava-13/", "book": "В сознание…", "n": 13}, "14": {"url": "../glava-14/", "book": "В сознание…", "n": 14}, "15": {"url": "../glava-15/", "book": "В сознание…", "n": 15}, "16": {"url": "../glava-16/", "book": "В сознание…", "n": 16}, "17": {"url": "../glava-17/", "book": "В сознание…", "n": 17}, "18": {"url": "../glava-18/", "book": "В сознание…", "n": 18}, "19": {"url": "../glava-19/", "book": "В сознание…", "n": 19}, "20": {"url": "../glava-20/", "book": "В сознание…", "n": 20}, "21": {"url": "../glava-21/", "book": "В сознание…", "n": 21}, "22": {"url": "../glava-22/", "book": "В сознание…", "n": 22}, "23": {"url": "../glava-23/", "book": "В сознание…", "n": 23}, "24": {"url": "../glava-24/", "book": "В сознание…", "n": 24}, "25": {"url": "../glava-25/", "book": "В сознание…", "n": 25}, "b2-1": {"url": "../v-soznanii/glava-1/", "book": "…В сознании", "n": 1}, "b2-2": {"url": "../v-soznanii/glava-2/", "book": "…В сознании", "n": 2}, "b2-3": {"url": "../v-soznanii/glava-3/", "book": "…В сознании", "n": 3}, "b2-4": {"url": "../v-soznanii/glava-4/", "book": "…В сознании", "n": 4}, "b2-5": {"url": "../v-soznanii/glava-5/", "book": "…В сознании", "n": 5}, "b2-6": {"url": "../v-soznanii/glava-6/", "book": "…В сознании", "n": 6}, "b2-7": {"url": "../v-soznanii/glava-7/", "book": "…В сознании", "n": 7}, "b2-8": {"url": "../v-soznanii/glava-8/", "book": "…В сознании", "n": 8}, "b2-9": {"url": "../v-soznanii/glava-9/", "book": "…В сознании", "n": 9}, "b2-10": {"url": "../v-soznanii/glava-10/", "book": "…В сознании", "n": 10}, "b2-11": {"url": "../v-soznanii/glava-11/", "book": "…В сознании", "n": 11}, "b2-12": {"url": "../v-soznanii/glava-12/", "book": "…В сознании", "n": 12}, "b2-13": {"url": "../v-soznanii/glava-13/", "book": "…В сознании", "n": 13}};
  var MONTHS = ["января","февраля","марта","апреля","мая","июня",
                "июля","августа","сентября","октября","ноября","декабря"];
  var box = document.getElementById("modList");
  var form = document.getElementById("keyForm");
  var input = document.getElementById("keyInput");
  var say = document.getElementById("keySay");
  function key(v){
    try { if (v !== undefined) localStorage.setItem("alon.key", v);
           return localStorage.getItem("alon.key") || ""; } catch(e){ return ""; }
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function when(ts){
    var d = new Date(ts);
    return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
  }
  function load(){
    var k = key();
    if (!k) { box.innerHTML = ""; return; }
    say.textContent = "…";
    fetch(API + "/notes/new?key=" + encodeURIComponent(k))
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(rows){ say.textContent = ""; draw(rows); })
      .catch(function(){ say.textContent = "Ключ не подошёл"; box.innerHTML = ""; });
  }
  function draw(rows){
    if (!rows.length) { box.innerHTML = '<p class="empty">Пока ничего нет.</p>'; return; }
    box.innerHTML = '<ul class="nt-list">' + rows.map(function(n){
      var w = WHERE[n.chapter] || null;
      var link = w ? ('<a href="' + w.url + '#p-' + n.pid + '">'
                      + esc(w.book) + ", глава " + w.n + "</a>") : esc(n.chapter);
      return '<li class="nt' + (n.hidden ? " gone" : "") + (n.author ? " auth" : "") + '">'
           + '<span class="nt-who">' + esc(n.name) + "</span> "
           + '<span class="nt-body">' + esc(n.body) + "</span> "
           + '<span class="nt-meta"><span class="nt-when">' + when(n.at) + "</span>"
           + '<button type="button" class="nt-act" data-id="' + n.id + '" data-show="'
           + (n.hidden ? "1" : "") + '">' + (n.hidden ? "вернуть" : "скрыть") + "</button>"
           + '</span><br><span class="nt-where">' + link + "</span></li>";
    }).join("") + "</ul>";
    box.querySelectorAll("[data-id]").forEach(function(b){
      b.addEventListener("click", function(){
        b.disabled = true;
        fetch(API + "/note/hide", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({id: b.dataset.id, key: key(), show: !!b.dataset.show})
        }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(load)
          .catch(function(){ b.disabled = false; });
      });
    });
  }
  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    key(input.value.trim());
    input.value = "";
    load();
  });
  if (key()) load();
})();
</script>
